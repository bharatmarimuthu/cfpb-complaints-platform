version: 2

sources:
  - name: raw
    description: Untouched API records written by the Python ingestion job (Phase 1).
    schema: raw
    tables:
      - name: complaints
        description: One row per complaint; raw_json is the API's _source object as returned.
        loaded_at_field: last_updated_at
        freshness:                       # `dbt source freshness` alerts if ingestion stalls
          warn_after: {count: 2, period: day}
          error_after: {count: 4, period: day}
        columns:
          - name: complaint_id
            data_tests: [unique, not_null]
          - name: raw_json
            data_tests: [not_null]
