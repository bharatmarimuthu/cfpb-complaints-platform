[project]
name = "cfpb-platform"
version = "0.3.0"
description = "Data platform for the CFPB Consumer Complaint Database"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "duckdb>=1.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "dbt-core>=1.10,<1.12",
    "dbt-duckdb>=1.9",
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dagster-dbt>=0.29,<0.30",
    # dbt-core 1.11 needs protobuf 6; newer grpcio-health-checking (a Dagster
    # dependency) needs protobuf 7. These pins keep both importable.
    "protobuf>=6,<7",
    "grpcio-health-checking<1.76",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

