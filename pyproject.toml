[project]
name = "cfpb-platform"
version = "0.2.0"
description = "Data platform for the CFPB Consumer Complaint Database"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "dbt-core>=1.10,<1.12", "dbt-duckdb>=1.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
